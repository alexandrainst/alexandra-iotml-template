# Linear autoencoder. `architecture` is instantiated directly by hydra
# (see src/scripts/train_model.py). `time_window_past` must match the dataset,
# and every `latent_dims` entry must be smaller than
# n_features * time_window_past (here 2 * 6 = 12).
name: "linear_ae_vanilla"
architecture:
  _target_: iotml_core.ml_tools.models.LinearAE
  time_window_past: 6
  latent_dims: [10, 6, 3]
  input_features:
    0: "y"
    1: "state"
