# Top-level hydra config. The `defaults` list composes one aimodel + one
# ml_training + one dataset into a single config that iotml_core.ml_tools.config
# .IoTMLConfig validates. Override any group on the command line, e.g.:
#   uv run python src/scripts/train_model.py ml_training=output_prediction aimodel=lstm
defaults:
  - _self_
  - aimodel: linear_ae
  - ml_training: anomaly_encoding
  - dataset: train

dirs:
  data: data
  raw: raw
  processed: processed
  final: final
  models: models

hydra:
  run:
    dir: outputs/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
