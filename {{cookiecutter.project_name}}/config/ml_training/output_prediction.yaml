# Output-predictor training. Pair with `aimodel=lstm` and a dataset whose
# `time_window_future` is > 0.
training_type: "output_predictor"
name: "output_predictor_example"
optimizer:
  _target_: torch.optim.Adam
  lr: 0.001
batch_size: 30
n_epochs: 10
loss:
  _target_: iotml_core.ml_tools.losses.RecoLoss
